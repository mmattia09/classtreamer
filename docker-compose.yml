services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: classtreamer:local
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - classtreamer

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Loopback only: the database is reachable from this machine for
      # development, never from the network. Drop this mapping in production.
      # Change DB_HOST_PORT if 5432 is already taken on the host.
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - classtreamer

  redis:
    image: redis:8-alpine
    ports:
      # Loopback only — see the note on postgres above.
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - classtreamer

  # Applies the Prisma schema once, before the app starts. Built from the
  # `migrator` stage, which keeps the Prisma CLI out of the runtime image.
  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    image: classtreamer-migrator:local
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - classtreamer

volumes:
  postgres_data:
  redis_data:

networks:
  classtreamer:
    driver: bridge
