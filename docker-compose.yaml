# Project name, so containers, network and volumes are prefixed predictably
# regardless of the directory this file is checked out into.
name: classtreamer

services:
  app:
    # Pulled, not built. Pin a version with APP_TAG=1.2.0 in .env to control
    # when you upgrade; the default follows the latest push to main.
    image: ghcr.io/mmattia09/classtreamer:${APP_TAG:-latest}
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - classtreamer

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published by default: the app reaches Postgres over the Compose
    # network, so nothing outside needs to. Uncomment only to inspect the
    # database from this machine — it binds to loopback, never the network.
    # For local development use docker-compose.dev.yaml instead, which adds
    # these mappings without editing this file.
    # ports:
    #   - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - classtreamer

  redis:
    image: redis:8-alpine
    # Not published by default — see the note on postgres above.
    # ports:
    #   - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - classtreamer

  # Applies the Prisma migrations once, before the app starts. Same image as the
  # app, with a different command — the Prisma CLI ships in it.
  db-init:
    image: ghcr.io/mmattia09/classtreamer:${APP_TAG:-latest}
    command: ["bun", "run", "prisma:migrate"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - classtreamer

volumes:
  postgres_data:
  redis_data:

networks:
  classtreamer:
    driver: bridge
